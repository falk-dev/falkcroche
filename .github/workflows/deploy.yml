
name: Deploy Falkcroche na VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Compilar e publicar na VPS
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Baixar dependências
        run: go mod download

      - name: Compilar aplicação Go
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o build/falkcroche-app .
          ls -lh build/falkcroche-app

      - name: Configurar chave SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Enviar executável para VPS
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -e

          echo "Enviando aplicação..."
          scp -i ~/.ssh/deploy_key \
            build/falkcroche-app \
            "$VM_USER@$VM_HOST:/tmp/falkcroche-app"

      - name: Instalar e reiniciar aplicação
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -e

          ssh -i ~/.ssh/deploy_key \
            "$VM_USER@$VM_HOST" \
            'set -eux
             APP_DIR=/home/ubuntu/falkcroche

             echo "Verificando diretório..."
             test -d "$APP_DIR"

             echo "Instalando executável..."
             install -m 755 /tmp/falkcroche-app "$APP_DIR/falkcroche-app"
             rm -f /tmp/falkcroche-app

             echo "Reiniciando serviço..."
             sudo systemctl restart falkcroche

             echo "Verificando serviço..."
             sudo systemctl is-active falkcroche'

          echo "Deploy concluído com sucesso!"
