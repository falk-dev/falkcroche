
name: Deploy FalkCroche

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: falkcroche-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build application
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o falkcroche-app main.go

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload application
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            falkcroche-app \
            "$VM_USER@$VM_HOST:/tmp/falkcroche-app"

      - name: Deploy and restart
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            'set -e
             install -m 755 /tmp/falkcroche-app /home/ubuntu/falkcroche/falkcroche-app
             rm -f /tmp/falkcroche-app
             sudo systemctl restart falkcroche
             systemctl is-active --quiet falkcroche'

      
      
      - name: Deploy na VPS
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -e

          echo "Verificando executável..."
          ls -l /tmp/falkcroche-app

          echo "Enviando executável para a VPS..."
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            /tmp/falkcroche-app \
            "$VM_USER@$VM_HOST:/tmp/falkcroche-app"

          echo "Instalando e reiniciando aplicação..."
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            'set -ex
             echo "Verificando diretório..."
             ls -ld /home/ubuntu/falkcroche

             echo "Instalando executável..."
             install -m 755 /tmp/falkcroche-app /home/ubuntu/falkcroche/falkcroche-app

             echo "Removendo arquivo temporário..."
             rm -f /tmp/falkcroche-app

             echo "Reiniciando serviço..."
             sudo systemctl restart falkcroche

             echo "Verificando status..."
             sudo systemctl status falkcroche --no-pager -l

             echo "Confirmando serviço ativo..."
             systemctl is-active --quiet falkcroche'

          echo "Deploy concluído!"

